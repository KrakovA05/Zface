            <div style="width:36px;height:36px;border-radius:18px;border:2px solid #8B7355;margin:0 auto 6px;display:flex;align-items:center;justify-content:center">
              <div style="width:20px;height:20px;border-radius:10px;border:2px solid #c9a96e"></div>

  {

    desc: "Мы анализируем твою активность — и подстраиваем рекомендации, контент и подсказки именно под тебя.",
    btn: "начать",
    screen: `
      <div style="background:#FAF7F2;padding:8px">
        <div style="background:white;border-radius:12px;padding:12px;border:1px solid #E8DFD0;margin-bottom:6px">

let current = 0;

function renderSlide(i) {
  const s = slides[i];
  document.getElementById('slide-container').innerHTML = `
    <div style="background:#FAF7F2;min-height:${s.screen ? '160px' : '80px'}">${s.screen || ''}</div>
    <div style="padding:14px;background:white">
      <div style="font-size:10px;color:#C0A882;font-weight:600;margin-bottom:4px">${s.num}</div>
      <div style="font-weight:700;font-size:14px;color:#2C2420;margin-bottom:5px">${s.title}</div>
      <div style="font-size:10px;color:#6B5B4E;line-height:1.55;margin-bottom:12px">${s.desc}</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;gap:3px">${slides.map((_,j) => `<div style="width:${j===i?'16px':'5px'};height:3px;border-radius:2px;background:${j===i?'#8B7355':'#E8DFD0'};transition:all 0.2s"></div>`).join('')}</div>
        <div style="background:#8B7355;color:white;border-radius:16px;padding:7px 16px;font-size:10px;font-weight:600;cursor:pointer" onclick="nextSlide()">${s.btn}</div>
      </div>
    </div>`;
  document.getElementById('slide-label').textContent = s.num;

  // Update list
  document.getElementById('slide-list').innerHTML = slides.map((sl, j) => `
    <div onclick="goTo(${j})" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;background:${j===i?'#FAF7F2':'transparent'};margin-bottom:3px;border:1px solid ${j===i?'#E8DFD0':'transparent'}">
      <div style="width:6px;height:6px;border-radius:3px;background:${j===i?'#8B7355':'#D0C4B8'};flex-shrink:0"></div>
      <div style="font-size:11px;color:${j===i?'#2C2420':'#8B7355'};font-weight:${j===i?'600':'400'}">${sl.title}</div>
    </div>`).join('');
}

function nextSlide() { if(current < slides.length-1) { current++; renderSlide(current); } }
function prevSlide() { if(current > 0) { current--; renderSlide(current); } }
function goTo(i) { current = i; renderSlide(i); }

renderSlide(0);
</script>
